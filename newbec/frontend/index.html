<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>newbec — ноты в табулатуру</title>
  <style>
    body { max-width: 960px; margin: 40px auto; padding: 0 16px; font: 16px system-ui, sans-serif; background: #111827; color: #f9fafb; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #4b5563; }
    input { width: min(620px, 75%); background: #1f2937; color: white; }
    button { cursor: pointer; background: #22c55e; color: #052e16; border: 0; font-weight: 700; }
    pre { overflow: auto; padding: 16px; background: #030712; border-radius: 8px; }
    .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <h1>Ноты → гитарная табулатура</h1>
  <p class="muted">Введите название произведения. Источники: Mutopia, затем IMSLP.</p>
  <form id="form"><input id="title" required placeholder="Например: Bach Invention 1"><button>Найти</button></form>
  <p id="status"></p>
  <pre id="result"></pre>
  <script>
    const form = document.querySelector('#form');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Ищу ноты…'; result.textContent = '';
      try {
        const title = document.querySelector('#title').value;
        const response = await fetch('/api/song?title=' + encodeURIComponent(title));
        const data = await response.json();
        status.textContent = data.status === 'ok' ? 'Готово: источник ' + data.source : data.message;
        result.textContent = data.tab ? data.tab.ascii + '\n\n' + JSON.stringify(data, null, 2) : JSON.stringify(data, null, 2);
      } catch (error) { status.textContent = 'Ошибка соединения'; result.textContent = String(error); }
    });
  </script>
</body>
</html>
